# Desired state for the ASUS VG32VQ1B.
# apply-settings.sh restores these values after login, wake and reconnect.
# Change a value here, then run: ./install.sh

# EDID identity (stable across reboots; see `m1ddc display list detailed`)
DISPLAY_NAME="VG32VQ1B"
DISPLAY_VENDOR=1715      # 0x06b3 = ASUSTek
DISPLAY_MODEL=13024      # 0x32e0

# Display mode: native panel resolution, landscape, 1:1 scale
DISPLAY_WIDTH=2560
DISPLAY_HEIGHT=1440
DISPLAY_REFRESH=144      # HDMI 2.0 maximum; 120 is a valid fallback

# DDC/CI brightness (0-100)
BRIGHTNESS=50

# AppleFontSmoothing, 0-3 (0 = off, crispest; 2 = medium was too soft on this panel)
FONT_SMOOTHING=0
